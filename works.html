<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品 · 温州中学科学及幻想文学社</title>
  <meta name="description" content="社员原创科幻作品集：小说、设定、随笔……">
  <meta property="og:type" content="website">
  <meta property="og:title" content="社员作品 · 温州中学科学及幻想文学社">
  <meta property="og:description" content="小说、设定、随笔——每一篇都始于一个脑洞。">
  <meta property="og:image" content="https://sne-program.github.io/wenzhou-sf-club-site/images/og-default.png">
  <meta property="og:url" content="https://sne-program.github.io/wenzhou-sf-club-site/works.html">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wzsf-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=23">
  <style>
    /* ============ 作品页：侧边栏筛选（宽屏）+ 手机抽屉（窄屏） ============ */
    .works-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
    .filter-panel {
      flex: 0 0 230px;
      position: sticky; top: 5.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.9rem;
      max-height: calc(100vh - 6.5rem);
      overflow-y: auto;
    }
    .fp-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem;
      padding: 0 0.2rem 0.7rem; border-bottom: 1px dashed var(--border);
    }
    .fp-head b { font-family: var(--font-display); font-weight: 700; }
    #fp-result { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
    .fp-sec { margin-top: 1.1rem; }
    .fp-sec h4 {
      font-size: 0.78rem; letter-spacing: 0.18em; color: var(--text-dim);
      margin-bottom: 0.55rem; font-weight: 500;
    }
    /* 世界观：整行按钮 + 枝干子列表 */
    .fp-world {
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
      width: 100%; text-align: left;
      background: transparent; border: 1px solid transparent; color: var(--text-dim);
      border-radius: 8px; padding: 0.42rem 0.55rem; margin: 0.1rem 0;
      font-size: 0.88rem; cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .fp-world:hover { color: var(--text); background: var(--surface-hover); }
    .fp-world.active { color: var(--accent); background: rgba(232, 177, 76, 0.1); border-color: var(--border-strong); }
    .fp-world .cnt { font-size: 0.72rem; opacity: 0.7; }
    .fp-hubs {
      margin: 0.2rem 0 0.4rem 0.65rem; padding-left: 0.7rem;
      border-left: 1px dashed var(--border);
      display: flex; flex-direction: column;
    }
    .fp-hub {
      display: flex; justify-content: space-between; gap: 0.4rem;
      background: transparent; border: none; color: var(--text-dim);
      padding: 0.3rem 0.5rem; font-size: 0.82rem; cursor: pointer;
      border-radius: 6px; text-align: left;
    }
    .fp-hub:hover { color: var(--text); background: var(--surface-hover); }
    .fp-hub.active { color: var(--teal); background: rgba(63, 216, 197, 0.08); }
    .fp-hub .cnt { font-size: 0.7rem; opacity: 0.7; }
    /* 分类/标签 chips */
    .fp-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .fp-chips .filter-chip { font-size: 0.82rem; padding: 0.22rem 0.55rem; }
    .works-main { flex: 1; min-width: 0; }
    .works-toolbar {
      display: flex; align-items: center; gap: 0.8rem;
      min-height: 2.4rem; margin-bottom: 1.2rem;
    }
    .filter-toggle { display: none; }
    .toolbar-count { color: var(--text-dim); font-size: 0.86rem; }
    .fp-mask { display: none; }
    /* 手机：筛选收进左侧抽屉 */
    @media (max-width: 899px) {
      .works-layout { display: block; }
      .filter-panel {
        position: fixed; inset: 0 auto 0 0; z-index: 61;
        width: min(84vw, 320px); height: 100dvh; max-height: none;
        border-radius: 0; border-right: 1px solid var(--border);
        background: var(--bg-soft);
        transform: translateX(-104%);
        transition: transform 0.28s ease;
        padding-bottom: 2rem;
      }
      .filter-panel.open { transform: none; box-shadow: 24px 0 60px rgba(0, 0, 0, 0.5); }
      .filter-toggle { display: inline-flex; }
      .fp-mask.show { display: block; position: fixed; inset: 0; z-index: 60; background: rgba(5, 3, 15, 0.5); }
    }
  </style>
</head>
<body>
  <div data-nav></div>

  <main class="container">
    <div class="page-head">
      <h1>社员作品</h1>
      <div class="sub">小说、设定集、科普随笔 —— 每一篇都始于一个脑洞。</div>
    </div>

    <div class="works-layout">
      <div class="fp-mask" id="fp-mask"></div>

      <!-- 筛选面板：宽屏常驻左栏；窄屏为抽屉（点「筛选」按钮展开） -->
      <aside class="filter-panel" id="filter-panel" hidden>
        <div class="fp-head"><b>筛选</b><span id="fp-result"></span></div>
        <section class="fp-sec">
          <h4>世界观</h4>
          <div id="f-world"></div>
        </section>
        <section class="fp-sec">
          <h4>分类</h4>
          <div class="fp-chips" id="f-cat"></div>
        </section>
        <section class="fp-sec" id="sec-tags" hidden>
          <h4>标签</h4>
          <div class="fp-chips" id="f-tags"></div>
        </section>
      </aside>

      <div class="works-main">
        <div class="works-toolbar">
          <button class="btn ghost filter-toggle" id="filter-toggle" type="button">☰ 筛选</button>
          <span class="toolbar-count" id="toolbar-count"></span>
        </div>
        <div class="grid" id="works">
          <div class="state"><div class="spinner"></div>正在加载作品……</div>
        </div>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/common.js?v=10"></script>
  <script src="js/api.js?v=7"></script>
  <script src="js/supabase.js?v=9"></script>
  <script src="js/auth.js?v=16"></script>
  <script>
    (async function () {
      const [works, worlds] = await Promise.all([fetchSection("works"), fetchSection("worlds")]);
      const worldList = worlds || [];

      // ---------- 侧边栏筛选（世界观/枝干 + 分类 + 标签组合） ----------
      const filterPanel = document.getElementById("filter-panel");
      const fWorld = document.getElementById("f-world");
      const fCat = document.getElementById("f-cat");
      const fTags = document.getElementById("f-tags");
      const fpResult = document.getElementById("fp-result");
      const toolbarCount = document.getElementById("toolbar-count");
      const filterToggle = document.getElementById("filter-toggle");
      const fpMask = document.getElementById("fp-mask");

      const params = new URLSearchParams(location.search);
      let curWorld = (params.get("世界观") || "").trim(); // "" = 全部；根名/类世界观名（兼容旧「杂文」别名）
      let curHub = (params.get("中心页") || "").trim();   // "" = 该根全部；枝干名
      let curCat = (params.get("分类") || "").trim();
      let curTags = (params.get("标签") || "").split(",").map((s) => s.trim()).filter(Boolean);

      function unique(values) {
        return [...new Set(values.filter(Boolean))];
      }
      // 分类已支持多选（数组）；兼容旧数据为字符串
      function catArr(it) {
        const c = it.category;
        return Array.isArray(c) ? c : (c ? [c] : []);
      }
      // 类世界观（kind='meta'）：无中心页作品自动并入
      const metaWorld = worldList.find((w) => w.kind === "meta");
      // 世界观/中心页匹配：works 条目带 world/hub 字段（gen-site-data 推导）
      function matchWorld(item) {
        if (!curWorld) return true; // 全部
        // 旧链接兼容：?世界观=杂文 → 归入类世界观（未配置类世界观时退回「无中心页」）
        if (curWorld === "杂文") return metaWorld ? item.world === metaWorld.name : !item.hubId;
        if (item.world !== curWorld) return false;
        if (curHub && item.hub !== curHub) return false;
        return true;
      }
      function match(item) {
        if (!matchWorld(item)) return false;
        if (curCat && !catArr(item).includes(curCat)) return false;
        return curTags.every((t) => (item.tags || []).includes(t));
      }
      function pushState() {
        const url = new URL(location.href);
        if (curWorld) url.searchParams.set("世界观", curWorld); else url.searchParams.delete("世界观");
        if (curHub) url.searchParams.set("中心页", curHub); else url.searchParams.delete("中心页");
        if (curCat) url.searchParams.set("分类", curCat); else url.searchParams.delete("分类");
        if (curTags.length) url.searchParams.set("标签", curTags.join(",")); else url.searchParams.delete("标签");
        history.replaceState(null, "", url.pathname + url.search);
      }

      // ---------- 渲染筛选面板 ----------
      function renderFilters() {
        // 世界观：全部 / 各根（类世界观随数据自然出现，整行按钮，计数右对齐）
        const worldBtns = [
          `<button class="fp-world${!curWorld ? " active" : ""}" data-kind="world" data-v="">
            <span>全部</span><span class="cnt">${works.length}</span>
          </button>`,
          ...worldList.map((w) => `
            <button class="fp-world${curWorld === w.name ? " active" : ""}" data-kind="world" data-v="${esc(w.name)}">
              <span>${esc(w.name)}${w.kind === "meta" ? "（杂文）" : ""}</span><span class="cnt">${w.workCount || 0}</span>
            </button>`),
        ];

        // 选中某根世界观后，缩进展示其枝干中心页（跨时代）
        const curW = worldList.find((w) => w.name === curWorld);
        if (curW && curW.hubs && curW.hubs.length) {
          worldBtns.push(`<div class="fp-hubs">
            <button class="fp-hub${!curHub ? " active" : ""}" data-kind="hub" data-v="">
              <span>全部枝干</span><span class="cnt">${curW.workCount || 0}</span>
            </button>
            ${curW.hubs.map((h) => `
              <button class="fp-hub${curHub === h.name ? " active" : ""}" data-kind="hub" data-v="${esc(h.name)}">
                <span>${esc(h.name)}</span><span class="cnt">${h.workCount || 0}</span>
              </button>`).join("")}
          </div>`);
        }
        fWorld.innerHTML = worldBtns.join("");

        // 分类
        const cats = unique(works.flatMap((w) => catArr(w)));
        fCat.innerHTML = cats.map((c) => `
          <button class="filter-chip${c === curCat ? " active" : ""}" data-kind="cat" data-v="${esc(c)}">
            ${esc(c)}<span class="cnt">${works.filter((w) => catArr(w).includes(c)).length}</span>
          </button>`).join("");

        // 标签
        const tagCount = {};
        works.forEach((w) => (w.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; }));
        const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);
        fTags.innerHTML = tags.map((t) => `
          <button class="filter-chip${curTags.includes(t) ? " active" : ""}" data-kind="tag" data-v="${esc(t)}">
            #${esc(t)}<span class="cnt">${tagCount[t]}</span>
          </button>`).join("");
        document.getElementById("sec-tags").hidden = !tags.length;

        // 面板可见性 + 结果计数
        const hasAny = Boolean(worldBtns.length || cats.length || tags.length);
        filterPanel.hidden = !hasAny;
        filterToggle.hidden = !hasAny;
        const total = works.filter(match).length;
        toolbarCount.textContent = `共 ${total} 篇作品`;
        fpResult.textContent = total ? `${total} 篇` : "无结果";
      }

      filterPanel.addEventListener("click", (e) => {
        const el = e.target.closest("[data-kind]");
        if (!el || el.disabled) return;
        const v = el.dataset.v;
        const kind = el.dataset.kind;
        if (kind === "world") {
          if (curWorld === v) { curWorld = ""; curHub = ""; }
          else { curWorld = v; curHub = ""; } // 切换世界观重置枝干
        } else if (kind === "hub") {
          curHub = curHub === v ? "" : v;
        } else if (kind === "cat") {
          curCat = curCat === v ? "" : v; // 分类单选，再点取消
        } else {
          curTags = curTags.includes(v) ? curTags.filter((t) => t !== v) : [...curTags, v]; // 标签多选
        }
        pushState();
        renderFilters();
        renderGrid();
      });

      // ---------- 手机抽屉开关 ----------
      function closeDrawer() {
        filterPanel.classList.remove("open");
        fpMask.classList.remove("show");
      }
      filterToggle.addEventListener("click", () => {
        const open = filterPanel.classList.toggle("open");
        fpMask.classList.toggle("show", open);
      });
      fpMask.addEventListener("click", closeDrawer);
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

      // ---------- 作品网格 ----------
      // 摘要为占位词（如“见附件”）且存在附件时，卡片显示引导文案
      function cardSummary(it) {
        const s = (it.summary || "").trim();
        if ((/^(见附件|详见附件|附件见文件|暂无|无)$/.test(s) || !s) && it.attachment)
          return "附件投稿 · 点击查看";
        return s;
      }
      // 卡片 meta：有枝干显示世界观链路，杂文弱化显示
      function worldMeta(it) {
        if (!it.world) return "🌌 杂文";
        let s = `🌌 ${it.world}`;
        if (it.era) s += ` · ${it.era}`;
        if (it.hub) s += ` · ${it.hub}`;
        return s;
      }
      function renderGrid() {
        const list = works.filter(match);
        document.querySelector("#works").innerHTML = list.length
          ? list.map((it) => `
            <a class="card" href="articles/${encodeURIComponent(it.id)}.html">
              <div class="card-cover" style="${coverStyle(it, it.title)}"><span class="cover-title">${esc(coverText(it.title))}</span></div>
              <div class="card-body">
                <h3>${esc(it.title)}</h3>
                <p>${esc(cardSummary(it))}</p>
                <div class="card-meta">
                  <span>${esc(worldMeta(it))}</span>
                  <span>${esc(catArr(it).join("、") || "未分类")}</span>
                  ${it.author ? `<span>${esc(it.author)}</span>` : ""}
                  ${it.tags && it.tags.length ? it.tags.map((t) => `<span>#${esc(t)}</span>`).join("") : ""}
                </div>
              </div>
            </a>`).join("")
          : `<div class="state">没有符合条件的作品，换个分类或标签试试</div>`;
      }
      renderFilters();
      renderGrid();
    })().catch((e) => {
      document.querySelector("#works").innerHTML =
        `<div class="state">作品加载失败，请检查网络后重试。<br><br><button class="btn" type="button" onclick="location.reload()">重试</button></div>`;
      console.error(e);
    });
  </script>
</body>
</html>
