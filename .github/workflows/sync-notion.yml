# Notion → 仓库静态数据 自动同步
# 触发方式（三重保险）：
#   1. Worker 每 5 分钟对比数据指纹，有变化时 repository_dispatch（推荐，最实时）
#   2. 手动：Actions 页点 Run workflow
#   3. 定时兜底：每小时一次（GitHub schedule 可能延迟，仅作兜底）
# 有变化时提交回 main → push 自动触发 deploy.yml 部署到 GitHub Pages。
name: Sync Notion Content

on:
  repository_dispatch:
    types: [sync-notion]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成静态数据
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/gen-site-data.mjs
          node scripts/gen-article-pages.mjs

      - name: 有变化则提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(sync): 同步 Notion 内容 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 远端可能已被其他提交推进，先 rebase 再 push（冲突则本次失败，下轮重试）
          git pull --rebase origin main
          git push
