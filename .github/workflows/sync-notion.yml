# Notion → main 内容同步
# 触发方式：
#   1) Cloudflare Worker 每 5 分钟对比 Notion 与 main 分支数据指纹，变化时
#      通过 repository_dispatch(sync-notion) 触发本工作流（主路径，见 worker/src/index.js）
#   2) workflow_dispatch 手动触发
# 作用：重新生成 site/data/*.json + site/articles/*.html，内容有变化时提交回 main；
#       提交 push 会自然触发 deploy.yml 部署到 GitHub Pages。
# 背景：GitHub Actions 的 schedule 是 best-effort（实际运行间隔可达数小时），
#       且仓库闲置 60 天会自动停摆，不能作为内容同步的可靠来源。
name: Sync Notion content

on:
  repository_dispatch:
    types: [sync-notion]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate site data & article pages from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::未配置 NOTION_TOKEN secret，跳过数据生成"
            exit 0
          fi
          node scripts/gen-site-data.mjs
          node scripts/gen-article-pages.mjs

      - name: Commit regenerated content back to main
        run: |
          if git diff --quiet -- site/data site/articles site/images/covers; then
            echo "内容无变化，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/articles site/images/covers
          git commit -m "sync: 从 Notion 同步最新内容"
          git push
