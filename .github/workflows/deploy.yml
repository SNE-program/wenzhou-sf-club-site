# 推送到 main 分支后自动部署到 GitHub Pages（gh-pages 分支模式）
# 说明：GitHub Pages 的 Source 需设置为 "Deploy from a branch" -> gh-pages。
# 此方式直接推送构建产物到 gh-pages 分支，绕开 deploy-pages 云服务（曾多次超时）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 定时重新拉取 Notion 数据并部署，保持内容新鲜（投稿闭环上架的作品也会自动出现）
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate site data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::未配置 NOTION_TOKEN secret，使用仓库内已有的 data/*.json"
          else
            node scripts/gen-site-data.mjs
          fi
      - name: Generate article pages & share image
        run: node scripts/gen-article-pages.mjs || echo "::warning::文章静态页生成失败，使用仓库内已有文件"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: wzmssf.club
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
