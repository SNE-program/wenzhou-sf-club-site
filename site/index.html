<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温州中学科学及幻想文学社</title>
  <meta name="description" content="温州中学科学及幻想文学社 —— 读科幻、写幻想、观星象、聊未来。">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div data-nav></div>

  <main class="container">
    <!-- 英雄区 -->
    <section class="hero" id="hero">
      <!-- 五环浑天仪 · 标题下方背景层 -->
      <div class="armillary-stage" id="armillary" aria-hidden="true"></div>

      <div class="hero-inner">
        <div class="hero-badge"><span class="badge-dot" aria-hidden="true"></span>Science &amp; Fiction · WZMS</div>
        <h1><span id="hero-name">温州中学科学及幻想文学社</span></h1>
        <p id="hero-intro">正在载入社团简介……</p>
        <div class="hero-cta">
          <a class="btn" href="activities.html">近期活动 <span aria-hidden="true">→</span></a>
          <a class="btn ghost" href="about.html">了解我们</a>
        </div>
        <div class="hero-scroll" aria-hidden="true"><span></span></div>
      </div>
    </section>

    <!-- 最新活动 -->
    <h2 class="section-title">近期活动</h2>
    <div class="grid" id="activities">
      <div class="state"><div class="spinner"></div>正在加载活动……</div>
    </div>
    <p style="margin-top:1rem"><a class="btn ghost" href="activities.html">查看全部活动 →</a></p>

    <!-- 精选作品 -->
    <h2 class="section-title">社员作品</h2>
    <div class="grid" id="works">
      <div class="state"><div class="spinner"></div>正在加载作品……</div>
    </div>
    <p style="margin-top:1rem"><a class="btn ghost" href="works.html">查看全部作品 →</a></p>
  </main>

  <div data-footer></div>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <!-- 五环浑天仪 · 英雄区背景层 -->
  <script type="module">
    const stage = document.getElementById("armillary");
    if (stage && typeof createArmillary === "undefined") {
      try {
        const { createArmillary } = await import("./js/armillary.js");
        window.__armillary = createArmillary(stage, {
          interactive: false,
          wheelZoom: false,
          autoRotate: true,
        });
      } catch (e) {
        console.warn("[浑天仪] 三维组件加载失败，舞台自动隐藏。", e);
        stage.classList.add("arm-failed");
      }
    }
  </script>
  <script>
    (async function () {
      // 站点信息
      try {
        const site = await fetchSection("site");
        const nameEl = document.querySelector("#hero-name");
        const introEl = document.querySelector("#hero-intro");
        if (site.name) nameEl.textContent = site.name;
        introEl.textContent = site.intro || introEl.textContent;
        document.title = (site.name || document.title) + " · 温中科幻社";
      } catch (e) { console.warn(e); }

      // 近期活动（取前 3 条）
      try {
        const acts = (await fetchSection("activities")).slice(0, 3);
        document.querySelector("#activities").innerHTML = acts.length
          ? acts.map((it) => `
            <a class="card" href="article.html?id=${encodeURIComponent(it.id)}&type=activity">
              <div class="card-cover" style="${coverStyle(it, it.title)}">${initialOf(it.title)}</div>
              <div class="card-body">
                <h3>${esc(it.title)}</h3>
                <p>${esc(it.summary)}</p>
                <div class="card-meta">
                  <span>${esc(dateLabel(it.date))}</span>
                  ${it.location ? `<span>${esc(it.location)}</span>` : ""}
                </div>
              </div>
            </a>`).join("")
          : `<div class="state">暂无活动，敬请期待</div>`;
      } catch (e) { console.warn(e); }

      // 精选作品（取前 3 条）
      try {
        const works = (await fetchSection("works")).slice(0, 3);
        document.querySelector("#works").innerHTML = works.length
          ? works.map((it) => `
            <a class="card" href="article.html?id=${encodeURIComponent(it.id)}&type=works">
              <div class="card-cover" style="${coverStyle(it, it.title)}">${initialOf(it.title)}</div>
              <div class="card-body">
                <h3>${esc(it.title)}</h3>
                <p>${esc(it.summary)}</p>
                <div class="card-meta">
                  <span>${esc(it.category || "未分类")}</span>
                  ${it.author ? `<span>${esc(it.author)}</span>` : ""}
                </div>
              </div>
            </a>`).join("")
          : `<div class="state">暂无作品，期待你的投稿</div>`;
      } catch (e) { console.warn(e); }
    })();
  </script>
</body>
</html>
