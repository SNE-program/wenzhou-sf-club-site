<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人员管理 · 温州中学科学及幻想文学社</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wzsf-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=12">
  <style>
    .um-item { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.8rem 0.2rem; border-bottom: 1px solid var(--border); }
    .um-item:last-child { border-bottom: none; }
    .um-info { min-width: 0; }
    .um-tags { margin-top: 0.25rem; display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .um-tag { font-size: 0.75rem; padding: 0.05rem 0.45rem; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
    .um-tag.admin { color: var(--accent); border-color: var(--accent); }
    .um-tag.muted { color: #f59e0b; border-color: #f59e0b; }
    .um-tag.banned { color: #f87171; border-color: #f87171; }
    .um-tag.pending { color: var(--accent); border-color: var(--accent); }
    .um-tag.rejected { color: #f87171; border-color: #f87171; }
    .um-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .um-actions .btn, .um-actions .c-btn { margin: 0; }
    .um-note { font-size: 0.8rem; color: var(--text-dim); }
    .um-empty { padding: 2rem 0; text-align: center; color: var(--text-dim); }
  </style>
</head>
<body>
  <div data-nav></div>

  <main class="container">
    <div class="page-head">
      <h1>人员管理</h1>
      <div class="sub">禁言（禁止评论）、封禁（禁止登录与重新注册）、踢出（注销账户，可重新入站）；禁言与封禁可撤销，踢出不可撤销。管理员账号不受这些操作影响，仅能通过命令工具添加或移除。</div>
      <p style="margin-top:1rem"><a class="btn" href="admin.html">入站审核</a> <a class="btn" href="admin-reports.html">举报处理</a> <a class="btn" href="admin-comments.html">评论管理</a> <a class="btn" href="admin-submissions.html">投稿审核</a> <a class="btn" href="admin-contests.html">管理竞赛</a></p>
    </div>

    <div id="admin-root">
      <div class="state"><div class="spinner"></div>正在加载……</div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/common.js?v=5"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/supabase.js?v=5"></script>
  <script src="js/auth.js?v=2"></script>
  <script>
    // 登录/登出后整页重建
    window.addEventListener("sb-auth-changed", () => location.reload());

    function timeLabel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    const STATUS_NAME = { approved: "已通过", pending: "待审核", rejected: "未通过" };

    (async function () {
      const root = document.getElementById("admin-root");
      const user = SB.user();
      if (!user) {
        root.innerHTML = `<div class="state"><p>请先登录管理员账号</p><p style="margin-top:1rem"><button class="btn" id="go-login" type="button">登录</button></p></div>`;
        document.getElementById("go-login").addEventListener("click", () => window.openAuthModal("login"));
        return;
      }
      const me = await window.getMyProfile();
      if (!me || !me.is_admin) {
        root.innerHTML = `<div class="state">你没有管理权限。</div>`;
        return;
      }

      let rows = [];
      async function loadRows() {
        rows = await SB.get("profiles", "select=user_id,nickname,email,status,is_admin,muted,banned,created_at&order=is_admin.desc,created_at.asc");
      }

      try {
        await loadRows();
      } catch (e) {
        root.innerHTML = `<div class="state">加载失败：${esc(e.message)}<br><br><button class="btn" type="button" onclick="location.reload()">重试</button></div>`;
        return;
      }

      function render() {
        if (!rows.length) {
          root.innerHTML = `<div class="um-empty">还没有注册用户。</div>`;
          return;
        }
        root.innerHTML = `
          <div class="audit-count">共 <b>${rows.length}</b> 位用户</div>
          ${rows.map((u) => {
            const isAdmin = !!u.is_admin;
            const tags = [];
            tags.push(`<span class="um-tag ${esc(u.status)}">${esc(STATUS_NAME[u.status] || u.status)}</span>`);
            if (isAdmin) tags.push(`<span class="um-tag admin">管理员</span>`);
            if (u.muted) tags.push(`<span class="um-tag muted">已禁言</span>`);
            if (u.banned) tags.push(`<span class="um-tag banned">已封禁</span>`);
            return `
              <div class="um-item" data-uid="${u.user_id}">
                <div class="um-info">
                  <span class="c-nick">${esc(u.nickname || "（无昵称）")}</span>
                  <span class="c-time">${esc(u.email || "")}</span>
                  <span class="c-time">注册于 ${esc(timeLabel(u.created_at))}</span>
                  <div class="um-tags">${tags.join("")}</div>
                </div>
                <div class="um-actions">
                  ${isAdmin
                    ? `<span class="um-note">管理员账号由命令工具管理</span>`
                    : `
                      ${u.muted
                        ? `<button class="btn ghost" type="button" data-act="unmute">解除禁言</button>`
                        : `<button class="btn ghost" type="button" data-act="mute">禁言</button>`}
                      ${u.banned
                        ? `<button class="btn ghost" type="button" data-act="unban">解除封禁</button>`
                        : `<button class="c-btn" type="button" data-act="ban">封禁</button>`}
                      <button class="c-btn audit-reject" type="button" data-act="kick">踢出</button>`}
                </div>
              </div>`;
          }).join("")}`;

        root.querySelectorAll("[data-act]").forEach((btn) => {
          const item = btn.closest(".um-item");
          const uid = item.dataset.uid;
          btn.addEventListener("click", () => handleAction(uid, btn.dataset.act, btn));
        });
      }

      async function handleAction(uid, act, btn) {
        const u = rows.find((r) => r.user_id === uid);
        const name = u.nickname || u.email || "该用户";
        btn.disabled = true;
        try {
          switch (act) {
            case "mute":
              if (!confirm(`确认禁言「${name}」吗？禁言后无法发表评论。`)) return;
              await SB.update("profiles", { muted: true }, `user_id=eq.${uid}`);
              break;
            case "unmute":
              if (!confirm(`确认解除「${name}」的禁言吗？`)) return;
              await SB.update("profiles", { muted: false }, `user_id=eq.${uid}`);
              break;
            case "ban":
              if (!confirm(`确认封禁「${name}」吗？封禁后无法登录，且该邮箱无法重新注册入站。`)) return;
              await SB.rpc("admin_set_banned", { target_uid: uid, banned_flag: true });
              break;
            case "unban":
              if (!confirm(`确认解除「${name}」的封禁吗？`)) return;
              await SB.rpc("admin_set_banned", { target_uid: uid, banned_flag: false });
              break;
            case "kick":
              if (!confirm(`确认踢出「${name}」吗？将注销其账户与全部数据（评论、表态、举报），此操作不可撤销；该邮箱之后可重新注册入站。`)) return;
              await SB.rpc("admin_delete_user", { target_uid: uid });
              break;
          }
          await loadRows();
          render();
        } catch (e) {
          btn.disabled = false;
          alert("操作失败：" + (e.message || "未知错误"));
        }
      }

      render();
    })();
  </script>
</body>
</html>
