<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品 · 温州中学科学及幻想文学社</title>
  <meta name="description" content="社员原创科幻作品集：小说、设定、随笔……">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div data-nav></div>

  <main class="container">
    <div class="page-head">
      <h1>社员作品</h1>
      <div class="sub">小说、设定集、科普随笔 —— 每一篇都始于一个脑洞。</div>
    </div>

    <div class="grid" id="works">
      <div class="state"><div class="spinner"></div>正在加载作品……</div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script>
    (async function () {
      const works = await fetchSection("works");
      document.querySelector("#works").innerHTML = works.length
        ? works.map((it) => `
          <article class="card">
            <div class="card-cover" style="${coverStyle(it, it.title)}">${initialOf(it.title)}</div>
            <div class="card-body">
              <h3>${esc(it.title)}</h3>
              <p>${esc(it.summary)}</p>
              <div class="card-meta">
                <span>${esc(it.category || "未分类")}</span>
                ${it.author ? `<span>${esc(it.author)}</span>` : ""}
              </div>
            </div>
          </article>`).join("")
        : `<div class="state">暂无作品，期待你的投稿</div>`;
    })().catch((e) => {
      document.querySelector("#works").innerHTML = `<div class="state">作品加载失败，请稍后刷新重试。</div>`;
      console.error(e);
    });
  </script>
</body>
</html>
