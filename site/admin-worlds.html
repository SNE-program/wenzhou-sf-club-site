<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界观管理 · 温州中学科学及幻想文学社</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wzsf-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=24">
  <link rel="stylesheet" href="css/admin.css?v=3">
  <style>
    .w-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.1rem; }
    .w-tab {
      padding: 0.55rem 1.3rem; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
      font-weight: 700; font-size: 0.92rem; transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .w-tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1c0f04; border-color: transparent;
    }
    .w-tab small { font-weight: 400; opacity: 0.75; margin-left: 0.2rem; }
    .w-hint { display: block; font-size: 0.8rem; color: var(--text-dim); margin-top: 0.4rem; line-height: 1.6; }
    .w-eras-preview {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.7rem 0.9rem; margin-top: 0.55rem; font-size: 0.85rem; color: var(--text-dim);
      line-height: 1.75; white-space: pre-wrap; display: none;
    }
    .w-eras-preview.show { display: block; }
    .w-era-item { display: block; }
    .w-era-item b { color: var(--accent); }
    .w-era-item em { color: #7cc4ff; font-style: normal; display: block; margin-left: 0.9rem; }
    .a-card .w-badge { font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; }
    .w-badge.on { background: rgba(52, 211, 153, 0.16); color: #34d399; }
    .w-badge.off { background: rgba(148, 163, 184, 0.14); color: var(--text-dim); }
  </style>
</head>
<body>
  <div data-nav></div>

  <main class="container">
    <div class="page-head">
      <h1>世界观管理</h1>
      <div class="sub">在线维护「世界观 / 中心页」，保存后写入网站数据库，重新构建后网站即更新（不再需要打开 Notion）。</div>
    </div>
    <div id="admin-nav"></div>

    <div class="w-tabs" id="w-tabs">
      <button class="w-tab active" type="button" data-tab="worlds">世界观<small id="tab-w-count"></small></button>
      <button class="w-tab" type="button" data-tab="hubs">中心页<small id="tab-h-count"></small></button>
    </div>

    <div id="admin-root">
      <div class="state"><div class="spinner"></div>正在加载……</div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/common.js?v=10"></script>
  <script src="js/api.js?v=7"></script>
  <script src="js/supabase.js?v=9"></script>
  <script src="js/auth.js?v=16"></script>
  <script src="js/admin.js?v=4"></script>
  <script>
    // 登录/登出后整页重建（表单依赖登录态，避免停留在未登录占位页）
    window.addEventListener("sb-auth-changed", () => location.reload());

    // uuid v4：worlds / hubs 的 id 列为 uuid 主键且无数据库默认值，
    // 新建（insert）时由前端生成（现代浏览器 crypto.randomUUID；老环境兜底随机）
    function genUuid() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
      });
    }

    // 时代线解析（与 gen-site-data / Worker 同一规则）：
    // 每条时代以「名称 | 时间段 | 简介首段」起头，其后可跟续段与引言行；
    // 以 “ 开头的行 → quote（引言），其余续行 → 追加到 desc 段落
    function parseEras(text) {
      const eras = [];
      let cur = null;
      for (const line of String(text || "").split("\n").map((l) => l.trim()).filter(Boolean)) {
        const parts = line.split("|");
        const isHead = parts.length >= 3 && parts[0].trim() && parts[1].trim();
        if (isHead) {
          if (cur) eras.push(cur);
          cur = { name: parts[0].trim(), range: parts[1].trim(), desc: parts.slice(2).join("|").trim(), quote: "" };
        } else if (cur) {
          if (line.startsWith("“")) cur.quote = (cur.quote ? cur.quote + "\n" : "") + line;
          else cur.desc = (cur.desc ? cur.desc + "\n" : "") + line;
        }
      }
      if (cur) eras.push(cur);
      return eras.filter((e) => e.name);
    }

    (async function () {
      const root = document.getElementById("admin-root");
      const user = SB.user();
      if (!user) {
        root.innerHTML = `<div class="state"><p>请先登录管理员账号</p><p style="margin-top:1rem"><button class="btn" id="go-login" type="button">登录</button></p></div>`;
        document.getElementById("go-login").addEventListener("click", () => window.openAuthModal("login"));
        return;
      }
      const me = await window.getMyProfile();
      if (!me || !me.is_admin) {
        root.innerHTML = `<div class="state">你没有管理权限。</div>`;
        return;
      }
      const stats = await window.loadTodoStats();
      window.adminNav("admin-worlds.html", stats);

      let worlds = [];
      let hubs = [];
      let currentTab = "worlds";

      async function loadAll() {
        const [w, h] = await Promise.all([
          SB.get("worlds", "select=*&order=sort_order.asc"),
          SB.get("hubs", "select=*&order=world.asc,sort.asc"),
        ]);
        worlds = Array.isArray(w) ? w : [];
        hubs = Array.isArray(h) ? h : [];
      }

      function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll("#w-tabs .w-tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
        render();
      }

      function coverHTML(item) {
        const cv = item && item.cover;
        if (cv) return `<div class="a-cover" style="background-image:url(${esc(cv)})"></div>`;
        return `<div class="a-cover" style="background:radial-gradient(120% 130% at 30% 22%, rgba(190,140,255,0.45), transparent 55%),linear-gradient(135deg,#1c1030,#3a2a6e 60%,#7a5cd6)">${esc((item && item.name || "?").charAt(0))}</div>`;
      }

      function renderWorlds() {
        document.getElementById("tab-w-count").textContent = worlds.length ? `（${worlds.length}）` : "";
        root.innerHTML = `
          <div class="c-toolbar">
            <span class="a-count" style="margin:0">共 <b>${worlds.length}</b> 个世界观</span>
            <button class="a-btn" id="btn-new-world" type="button">＋ 新建世界观</button>
          </div>
          <div id="form-wrap" hidden></div>
          <div id="world-list">
            ${worlds.length
              ? worlds.map((w) => {
                  const eras = parseEras(w.eras_text);
                  const isMeta = w.kind === "meta";
                  const hubCount = hubs.filter((h) => h.world === w.name).length;
                  return `
                  <div class="a-card" data-id="${w.id}">
                    ${coverHTML(w)}
                    <div class="a-card-main">
                      <div class="a-card-title">${esc(w.name)} ${isMeta ? `<span class="w-badge">类世界观</span>` : ""} <span class="w-badge ${w.shown ? "on" : "off"}">${w.shown ? "展示中" : "已隐藏"}</span></div>
                      <div class="a-card-meta">
                        ${isMeta ? `<span>杂文归集 · 无时代线</span>` : (eras.length ? `<span>时代线 ${eras.length} 个时代</span>` : "")}
                        ${isMeta ? "" : `<span>${hubCount} 个中心页</span>`}
                        ${w.sort_order ? `<span>排序 ${w.sort_order}</span>` : ""}
                      </div>
                      ${w.summary ? `<div class="a-card-text">${esc(String(w.summary).slice(0, 120))}${w.summary.length > 120 ? "…" : ""}</div>` : ""}
                    </div>
                    <div class="a-card-actions">
                      <button class="a-btn" type="button" data-act="edit">编辑</button>
                      <button class="a-btn danger" type="button" data-act="del">删除</button>
                    </div>
                  </div>`;
                }).join("")
              : `<div class="state">还没有世界观，点「新建世界观」创建第一个。</div>`}
          </div>`;
      }

      function worldFormHTML(item) {
        const v = (k) => (item ? item[k] ?? "" : "");
        return `
          <div class="contest-form">
            <form id="world-form">
              <input type="hidden" name="id" value="${item ? item.id : ""}">
              <div class="c-grid">
                <label class="c-field span2">名称 *<input name="name" required value="${esc(v("name"))}" placeholder="如：上升"></label>
                <label class="c-field">类型
                  <select name="kind" id="world-kind">
                    <option value="world"${v("kind") !== "meta" ? " selected" : ""}>普通世界观（含时代线）</option>
                    <option value="meta"${v("kind") === "meta" ? " selected" : ""}>类世界观（杂文归集）</option>
                  </select>
                  <span class="w-hint">类世界观用于归集无中心页的作品（杂文），不设时代线，也不会出现在投稿可选中心页中。</span>
                </label>
                <label class="c-field">排序<input type="number" name="sort_order" value="${v("sort_order") ?? 0}" step="1"></label>
              </div>
              <label class="c-field">简介<textarea name="summary" rows="3">${esc(v("summary"))}</textarea></label>
              <label class="c-field">设定正文<textarea name="body" rows="4">${esc(v("body"))}</textarea></label>
              <div id="era-fields">
                <label class="c-field">时代线
                  <textarea name="eras_text" id="eras-text" rows="5" placeholder="每行一个时代：&#10;时代名 | 时间段 | 时代简介&#10;简介续段/引言行可换行">${esc(v("eras_text"))}</textarea>
                  <span class="w-hint">每个时代以 <b>时代名 | 时间段 | 简介首段</b> 起头，其后可换行追加简介续段；以 <b>“</b> 开头的行会被识别为引言行，单独展示。例：<br>微光 | B.C.5000000-A.D.2000 | 人类尚在历史长河中的年代<br>“地平线上的，或是超越地平线上的。”</span>
                  <button class="a-btn ghost" type="button" id="eras-preview-btn" style="margin-top:0.5rem">预览时代线</button>
                  <div class="w-eras-preview" id="eras-preview"></div>
                </label>
              </div>
              <label class="c-field">封面
                <input name="cover" id="cover-url" value="${esc(v("cover"))}" placeholder="图片直链（https://…）或在上传后自动填入">
                <div class="file-pick">
                  <label class="a-btn ghost file-btn" for="cover-file">上传封面图片</label>
                  <input type="file" id="cover-file" accept="image/*" hidden>
                  <span class="c-fname" id="cover-name">${v("cover") ? "已填封面链接" : "未选择文件"}</span>
                </div>
              </label>
              <label class="c-check">
                <input type="checkbox" name="shown" ${v("shown") !== false ? "checked" : ""}> 展示此世界观（关闭后网站隐藏其时代之树）
              </label>
              <div class="c-actions">
                <button class="a-btn" type="submit">${item ? "保存修改" : "创建世界观"}</button>
                <button class="a-btn ghost" type="button" id="form-cancel">取消</button>
              </div>
            </form>
          </div>`;
      }

      function renderHubs() {
        document.getElementById("tab-h-count").textContent = hubs.length ? `（${hubs.length}）` : "";
        root.innerHTML = `
          <div class="c-toolbar">
            <span class="a-count" style="margin:0">共 <b>${hubs.length}</b> 个中心页</span>
            <button class="a-btn" id="btn-new-hub" type="button">＋ 新建中心页</button>
          </div>
          <div id="form-wrap" hidden></div>
          <div id="hub-list">
            ${hubs.length
              ? hubs.map((h) => `
                <div class="a-card" data-id="${h.id}">
                  ${coverHTML(h)}
                  <div class="a-card-main">
                    <div class="a-card-title">${esc(h.name)} <span class="w-badge ${h.shown ? "on" : "off"}">${h.shown ? "展示中" : "已隐藏"}</span></div>
                    <div class="a-card-meta">
                      <span>🌍 ${esc(h.world || "未指定世界观")}</span>
                      ${h.era ? `<span>⏳ ${esc(h.era)}</span>` : ""}
                      ${h.theme ? `<span>${esc(h.theme)}</span>` : ""}
                      ${h.sort ? `<span>排序 ${h.sort}</span>` : ""}
                    </div>
                    ${h.summary ? `<div class="a-card-text">${esc(String(h.summary).slice(0, 120))}${h.summary.length > 120 ? "…" : ""}</div>` : ""}
                  </div>
                  <div class="a-card-actions">
                    <button class="a-btn" type="button" data-act="edit">编辑</button>
                    <button class="a-btn danger" type="button" data-act="del">删除</button>
                  </div>
                </div>`).join("")
              : `<div class="state">还没有中心页，点「新建中心页」创建第一个。</div>`}
          </div>`;
      }

      function hubFormHTML(item) {
        const v = (k) => (item ? item[k] ?? "" : "");
        // 类世界观（kind='meta'）无枝干中心页，不出现在所属世界观下拉
        const worldOptions = worlds.filter((w) => w.kind !== "meta")
          .map((w) => `<option value="${esc(w.name)}"${v("world") === w.name ? " selected" : ""}>${esc(w.name)}</option>`).join("");
        return `
          <div class="contest-form">
            <form id="hub-form">
              <input type="hidden" name="id" value="${item ? item.id : ""}">
              <div class="c-grid">
                <label class="c-field">名称 *<input name="name" required value="${esc(v("name"))}" placeholder="如：室女座联盟编年"></label>
                <label class="c-field">所属世界观
                  <select name="world" id="hub-world">${worldOptions || `<option value="">（先创建世界观）</option>`}</select>
                </label>
                <label class="c-field">所属时代
                  <select name="era" id="hub-era"><option value="">（根级未归档）</option></select>
                  <input type="hidden" id="hub-era-orig" value="${esc(v("era"))}">
                </label>
                <label class="c-field">排序<input type="number" name="sort" value="${v("sort") ?? 0}" step="1"></label>
              </div>
              <label class="c-field">主题<textarea name="theme" rows="2" placeholder="一句话点明该中心页主题">${esc(v("theme"))}</textarea></label>
              <label class="c-field">简介<textarea name="summary" rows="3">${esc(v("summary"))}</textarea></label>
              <label class="c-field">设定正文<textarea name="body" rows="4">${esc(v("body"))}</textarea></label>
              <label class="c-field">封面
                <input name="cover" id="hub-cover-url" value="${esc(v("cover"))}" placeholder="图片直链（https://…）或在上传后自动填入">
                <div class="file-pick">
                  <label class="a-btn ghost file-btn" for="hub-cover-file">上传封面图片</label>
                  <input type="file" id="hub-cover-file" accept="image/*" hidden>
                  <span class="c-fname" id="hub-cover-name">${v("cover") ? "已填封面链接" : "未选择文件"}</span>
                </div>
              </label>
              <label class="c-check">
                <input type="checkbox" name="shown" ${v("shown") !== false ? "checked" : ""}> 展示此中心页（关闭后该枝干不出现）
              </label>
              <div class="c-actions">
                <button class="a-btn" type="submit">${item ? "保存修改" : "创建中心页"}</button>
                <button class="a-btn ghost" type="button" id="form-cancel">取消</button>
              </div>
            </form>
          </div>`;
      }

      function render() {
        if (currentTab === "worlds") renderWorlds(); else renderHubs();
        bindList();
        const newBtn = document.getElementById("btn-new-world") || document.getElementById("btn-new-hub");
        if (newBtn) newBtn.addEventListener("click", () => {
          const wrap = document.getElementById("form-wrap");
          wrap.hidden = false;
          wrap.innerHTML = currentTab === "worlds" ? worldFormHTML(null) : hubFormHTML(null);
          bindForm();
          wrap.scrollIntoView({ behavior: "smooth" });
        });
      }

      function bindList() {
        const listId = currentTab === "worlds" ? "world-list" : "hub-list";
        const rows = currentTab === "worlds" ? worlds : hubs;
        const list = document.getElementById(listId);
        if (!list) return;
        list.querySelectorAll(".a-card").forEach((item) => {
          const id = item.dataset.id;
          const rec = rows.find((r) => r.id === id);
          item.querySelector('[data-act="edit"]').addEventListener("click", () => {
            const wrap = document.getElementById("form-wrap");
            wrap.hidden = false;
            wrap.innerHTML = currentTab === "worlds" ? worldFormHTML(rec) : hubFormHTML(rec);
            bindForm();
            wrap.scrollIntoView({ behavior: "smooth" });
          });
          item.querySelector('[data-act="del"]').addEventListener("click", async () => {
            const hint = currentTab === "worlds"
              ? "删除后其中心页将失去所属世界观；已关联的作品按杂文处理。此操作不可恢复。"
              : "删除后已关联的作品将按杂文处理。此操作不可恢复。";
            const ok = await window.adminConfirm({
              title: `确认删除「${rec.name}」？`,
              message: hint,
              danger: true,
              okText: "删除",
            });
            if (!ok) return;
            item.querySelectorAll("button").forEach((b) => (b.disabled = true));
            try {
              await SB.remove(currentTab, `id=eq.${id}`);
              if (currentTab === "worlds") worlds = worlds.filter((r) => r.id !== id);
              else hubs = hubs.filter((r) => r.id !== id);
              render();
            } catch (e) {
              alert("删除失败：" + e.message);
              item.querySelectorAll("button").forEach((b) => (b.disabled = false));
            }
          });
        });
      }

      // 时代线预览（世界观表单）
      function bindEraPreview() {
        const btn = document.getElementById("eras-preview-btn");
        const pre = document.getElementById("eras-preview");
        const ta = document.getElementById("eras-text");
        if (!btn || !pre || !ta) return;
        btn.addEventListener("click", () => {
          const eras = parseEras(ta.value);
          if (!eras.length) {
            pre.classList.add("show");
            pre.textContent = "（未识别到时代行，请按「时代名 | 时间段 | 简介首段」开头，续段/引言行换行）";
            return;
          }
          pre.classList.add("show");
          pre.innerHTML = eras.map((e) => `<span class="w-era-item"><b>${esc(e.name)}</b>${e.range ? `｜${esc(e.range)}` : ""}${e.desc ? `｜${esc(e.desc)}` : ""}${e.quote ? `<em>｜${esc(e.quote)}</em>` : ""}</span>`).join("");
        });
      }

      // 中心页表单：所属世界观变化 → 重填时代下拉
      function bindHubEra() {
        const wSel = document.getElementById("hub-world");
        const eSel = document.getElementById("hub-era");
        const origEl = document.getElementById("hub-era-orig");
        if (!wSel || !eSel) return;
        eSel.dataset.current = origEl ? origEl.value : "";
        const fill = () => {
          const world = worlds.find((w) => w.name === wSel.value);
          const eras = world ? parseEras(world.eras_text) : [];
          const cur = eSel.dataset.current || "";
          eSel.innerHTML = `<option value="">（根级未归档）</option>` +
            eras.map((e) => `<option value="${esc(e.name)}"${e.name === cur ? " selected" : ""}>${esc(e.name)}</option>`).join("");
        };
        wSel.addEventListener("change", () => {
          eSel.dataset.current = "";
          fill();
        });
        fill();
      }

      async function bindForm() {
        const form = document.getElementById("world-form") || document.getElementById("hub-form");
        const cancel = document.getElementById("form-cancel");
        const MAX_FILE = 10 * 1024 * 1024;
        cancel.addEventListener("click", () => { document.getElementById("form-wrap").hidden = true; });

        if (currentTab === "worlds") {
          bindEraPreview();
          // 类世界观无时代线：选择「类世界观」时隐藏时代线字段
          const kindSel = document.getElementById("world-kind");
          const eraFields = document.getElementById("era-fields");
          if (kindSel && eraFields) {
            const sync = () => { eraFields.style.display = kindSel.value === "meta" ? "none" : ""; };
            kindSel.addEventListener("change", sync);
            sync();
          }
        } else {
          bindHubEra();
        }

        // 封面上传（两个表单共用逻辑）
        const isWorld = currentTab === "worlds";
        const fileInput = document.getElementById(isWorld ? "cover-file" : "hub-cover-file");
        const coverInput = document.getElementById(isWorld ? "cover-url" : "hub-cover-url");
        const nameEl = document.getElementById(isWorld ? "cover-name" : "hub-cover-name");
        let uploadedUrl = "";
        if (fileInput) {
          fileInput.addEventListener("change", async () => {
            const f = fileInput.files[0];
            if (!f) return;
            if (f.size > MAX_FILE) { nameEl.textContent = "文件超过 10MB，请压缩后重试"; return; }
            nameEl.textContent = "上传中…";
            try {
              const uid = (SB.user() || {}).id || "admin";
              const safe = String(f.name || "cover").replace(/[^\x00-\x7F]/g, "_").replace(/[\\/:*?"<>|#%&{}$!'@+`=]/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "cover";
              uploadedUrl = await SB.uploadFile(`worlds/${uid}/${Date.now()}_${safe}`, f);
              coverInput.value = uploadedUrl;
              nameEl.textContent = `已上传：${f.name}`;
            } catch (err) {
              nameEl.textContent = "上传失败：" + (err.message || "未知错误");
            }
          });
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const fd = new FormData(form);
          const id = fd.get("id");
          const isWorld = currentTab === "worlds";
          let body;
          if (isWorld) {
            const kind = fd.get("kind") === "meta" ? "meta" : "world";
            body = {
              name: fd.get("name").trim(),
              kind,
              summary: fd.get("summary").trim(),
              body: fd.get("body").trim(),
              eras_text: kind === "meta" ? "" : fd.get("eras_text").trim(),
              cover: fd.get("cover").trim() || "",
              shown: fd.get("shown") === "on",
              sort_order: Number(fd.get("sort_order")) || 0,
            };
          } else {
            body = {
              name: fd.get("name").trim(),
              world: fd.get("world").trim(),
              era: fd.get("era").trim(),
              theme: fd.get("theme").trim(),
              summary: fd.get("summary").trim(),
              body: fd.get("body").trim(),
              sort: Number(fd.get("sort")) || 0,
              cover: fd.get("cover").trim() || "",
              shown: fd.get("shown") === "on",
            };
          }
          if (!body.name) return;
          const btn = form.querySelector("button[type=submit]");
          btn.disabled = true;
          btn.textContent = "保存中…";
          try {
            if (id) {
              await SB.update(currentTab, body, `id=eq.${id}`);
            } else {
              // worlds/hubs 的 id 列为 uuid 主键且无默认值，新建时前端生成
              await SB.insert(currentTab, { id: genUuid(), ...body });
            }
            await loadAll();
            render();
          } catch (err) {
            alert("保存失败：" + err.message);
            btn.disabled = false;
            btn.textContent = id ? "保存修改" : "创建";
          }
        });
      }

      document.querySelectorAll("#w-tabs .w-tab").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));

      try {
        await loadAll();
        render();
      } catch (e) {
        root.innerHTML = `<div class="state">加载失败：${esc(e.message)}<br><br><button class="btn" type="button" onclick="location.reload()">重试</button></div>`;
      }
    })();
  </script>
</body>
</html>
